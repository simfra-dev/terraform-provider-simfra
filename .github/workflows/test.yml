name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go test -short ./...

  acceptance:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build Simfra
        run: |
          git clone https://github.com/simfra-dev/simfra.git /tmp/simfra
          cd /tmp/simfra && make build-backend
          /tmp/simfra/simfra &
          sleep 3
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          SIMFRA_ENDPOINT: "http://localhost:4599"
        run: go test -v -timeout 120m ./...
